# Canonical CI for P-Trades Hub.
#
# `bun run verify` is the single command developers and CI both run:
#   lint (blocking sources) -> typecheck -> blocking tests -> production build
#
# Repo-wide `bun run lint` currently reports substantial pre-existing Prettier
# and semantic debt, so it runs as a separate non-blocking step until that debt
# is cleared. Exact current counts belong in the dated verification report, not
# this workflow comment.
#
# Blocking tests are the `blocking` Vitest project: [UNIT],
# [V1_CHARACTERIZATION] and [INVARIANT]. The `report` project ([INTENDED_V2])
# runs separately and never fails the pipeline.
#
# No network access to MetaApi, Supabase or any broker is required or permitted:
# every fixture is synthetic or already-stored data.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pin the hosted image: its documented PostgreSQL 16 binaries are installed
    # under /usr/lib/postgresql/16/bin but are not exposed on PATH by default.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: a floating Bun makes CI non-reproducible.
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Expose PostgreSQL 16 test tools
        run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Verify (lint blocking sources, typecheck, blocking tests, build)
        run: bun run verify

      - name: "Repo-wide lint (non-blocking: pre-existing formatting debt)"
        if: always()
        continue-on-error: true
        run: bun run lint

      - name: Intended-V2 report (non-blocking)
        if: always()
        continue-on-error: true
        run: bun run test:report
