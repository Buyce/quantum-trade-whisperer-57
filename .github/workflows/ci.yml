# Canonical CI for P-Trades Hub.
#
# `bun run verify` is the single command developers and CI both run:
#   lint (blocking sources) -> typecheck -> blocking tests -> production build
#
# Repo-wide `bun run lint` currently reports ~2.2k pre-existing prettier
# formatting errors that predate this suite, so it runs as a separate
# non-blocking step until that debt is cleared.
#
# Blocking tests are the `blocking` Vitest project: [UNIT],
# [V1_CHARACTERIZATION] and [INVARIANT]. The `report` project ([INTENDED_V2])
# runs separately and never fails the pipeline.
#
# No network access to MetaApi, Supabase or any broker is required or permitted:
# every fixture is synthetic or already-stored data.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: a floating Bun makes CI non-reproducible.
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (lint blocking sources, typecheck, blocking tests, build)
        run: bun run verify

      - name: Repo-wide lint (non-blocking: pre-existing formatting debt)
        if: always()
        continue-on-error: true
        run: bun run lint

      - name: Intended-V2 report (non-blocking)
        if: always()
        continue-on-error: true
        run: bun run test:report
