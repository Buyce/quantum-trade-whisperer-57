# Canonical CI for P-Trades Hub.
#
# `bun run verify` is the single command developers and CI both run:
#   full-repository lint -> typecheck -> blocking tests -> production build
#
# Blocking tests are the `blocking` Vitest project: [UNIT],
# [V1_CHARACTERIZATION] and [INVARIANT]. The `report` project ([INTENDED_V2])
# runs separately and never fails the pipeline.
#
# No network access to MetaApi, Supabase or any broker is required or permitted:
# every fixture is synthetic or already-stored data.
name: verify

on:
  push:
    # Pull-request branches are verified by the pull_request event below.
    # Running both events for the same branch wastes capacity and previously
    # made a single PR display two competing results for the same check name.
    branches: [main]
  pull_request:
  # Required if branch protection later enables GitHub's merge queue.
  merge_group:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Pin the hosted image: its documented PostgreSQL 16 binaries are installed
    # under /usr/lib/postgresql/16/bin but are not exposed on PATH by default.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: a floating Bun makes CI non-reproducible.
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Expose PostgreSQL 16 test tools
        run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Verify (full lint, typecheck, blocking tests, build)
        run: bun run verify

      - name: Intended-V2 report (non-blocking)
        if: always()
        continue-on-error: true
        run: bun run test:report
