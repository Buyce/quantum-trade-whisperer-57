name: one-off-format-baseline

on:
  push:
    branches:
      - fix/q-core-shadow-confidence-20260927

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-baseline]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/q-core-shadow-confidence-20260927
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Apply repository formatter
        run: bun run format
      - name: Confirm lint after formatting
        run: bun run lint
      - name: Commit mechanical formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format repository baseline [format-baseline]"
          git push origin HEAD:fix/q-core-shadow-confidence-20260927
