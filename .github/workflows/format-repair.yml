name: temporary-format-repair

on:
  push:
    branches:
      - feat/microstructure-shadow-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/microstructure-shadow-foundation
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply repository formatter
        run: bun run format
      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format repository for clean CI"
          git push origin HEAD:feat/microstructure-shadow-foundation
