name: Generate MT5 bridge route tree
on:
  push:
    branches: [feat/direct-mt5-bridge-foundation]
    paths:
      - src/routes/api/public/mt5-bridge/ingest.ts
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/direct-mt5-bridge-foundation
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Commit generated route tree
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "Generate direct MT5 ingest route"
          git push origin HEAD:feat/direct-mt5-bridge-foundation
